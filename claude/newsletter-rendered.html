          border-bottom: 1px solid rgba(205, 205, 205, 0.08);
        }

        .p-footer {
          border-top: 1px solid rgba(205, 205, 205, 0.08);
        }

        .p-bg {
          background: #f0f0ea;
        }

        .p-bg--secondary {
          background: #3b3b3b;
        }

    <style>
      /* ============================================
   Piano ID Profile — Custom Styles
   Replaces the inline <style> block in profile.html
   Uses design tokens from style.css
   ============================================ */

      @import url("https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@400;600;700&family=Inter:opsz,wght@14..32,100..900&display=swap");

      :root {
        --black: #000000;
        --white: #ffffff;
        --borderwidth__1: 1px;
        --font__family__fira: "Fira Sans Condensed", sans-serif;
        --font__family__inter: "Inter", sans-serif;
        --font__size__2xl: 24px;
        --font__size__base: 16px;
        --font__size__sm: 14px;
        --font__size__xs: 12px;
        --font__weight__bold: 700;
        --font__weight__extrabold: 800;
        --font__weight__semibold: 600;
        --font__weight__medium: 500;
        --font__weight__normal: 400;
        --ol__monochrome__50: #f5f6f6;
        --ol__monochrome__100: #e5e8e8;
        --ol__monochrome__200: #cdd3d4;
        --ol__monochrome__300: #aab3b6;
        --ol__monochrome__400: #808d90;
        --ol__monochrome__500: #657275;
        --ol__monochrome__700: #4a5254;
        --ol__monochrome__950: #17191a;
        --ol__red__50: #fff0f1;
        --ol__red__100: #ffdddf;
        --ol__red__700: #e3000f;
        --ol__red__800: #af0510;
        --ol__cream__50: #fff8eb;
        --radius__sm: 4px;
        --radius__md: 6px;
        --radius__lg: 8px;
        --radius__xl: 12px;
        --spacing__1: 4px;
        --spacing__2: 8px;
        --spacing__3: 12px;
        --spacing__4: 16px;
        --spacing__5: 20px;
        --spacing__6: 24px;
      }

      /* --- Resets --- */

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      div,
      section,
      ul,
      li,
      h1,
      h2,
      h3,
      h4,
      table,
      td,
      tr,
      form,
      label,
      iframe {
        margin: 0;
        padding: 0;
        border: 0;
      }

      ul {
        list-style: none;
      }
      svg {
        overflow: visible;
      }

      button,
      input,
      select,
      textarea {
        margin: 0;
        font-size: 100%;
        vertical-align: middle;
      }
      button,
      input {
        line-height: normal;
      }
      button::-moz-focus-inner,
      input::-moz-focus-inner {
        padding: 0;
        border: 0;
      }

      button,
      html input[type="button"],
      input[type="reset"],
      input[type="submit"] {
        cursor: pointer;
        -webkit-appearance: button;
      }

      label {
        display: block;
      }
      div[hidden] {
        display: none;
      }

      /* --- Base --- */

      html,
      body {
        font-size: 15px;
      }

      body {
        margin: 0;
        background: var(--ol__monochrome__50);
        color: var(--ol__monochrome__950);
        font-family: var(--font__family__inter);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        font-family: var(--font__family__inter) !important;
      }

      t {
        unicode-bidi: plaintext;
      }

      /* --- Main container --- */

      .content-padding-tb {
        clear: both;
        padding: 0rem !important;
      }

      /* --- Success message --- */

      .complete-msg {
        padding: var(--spacing__3) var(--spacing__4);
        margin-bottom: var(--spacing__4);
        background: #dff0d8;
        border-radius: var(--radius__lg);
        font-family: var(--font__family__inter);
        font-size: var(--font__size__xs);
        font-weight: var(--font__weight__medium);
        color: #3c763d;
        line-height: 1.5;
      }

      /* --- Card wrapper --- */

      .ma-profile__card {
        background: var(--white);
        border-radius: var(--radius__lg);
        padding: var(--spacing__4);
        margin-bottom: var(--spacing__2);
      }

      /* --- Form layout inside cards --- */

      .tp-form {
        background: none;
        border-radius: 0;
        padding: 0;
        margin-bottom: 0;
      }

      .tp-form + .tp-form {
        margin-top: var(--spacing__3);
      }

      .tp-form .control-group {
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: flex-start;
        margin-bottom: 0;
      }

      .tp-form .control-label {
        width: auto;
        flex-shrink: 0;
        font-family: var(--font__family__inter);
        font-size: var(--font__size__sm);
        font-weight: var(--font__weight__medium);
        color: var(--ol__monochrome__950);
        line-height: 1.35;
        margin-bottom: var(--spacing__1);
      }

      .tp-form .control-label-icon {
        cursor: pointer;
        width: 20px;
        margin-left: var(--spacing__1);
        margin-right: calc(var(--spacing__4) * -1);
        flex-shrink: 0;
      }

      .tp-form .controls {
        flex: 1;
        min-width: 0;
        width: 100%;
        padding-left: 0;
      }

      .tp-form .control-group::after {
        clear: both;
      }

      .tp-form .control-group::before,
      .tp-form .control-group::after,
      .tp-form .controls::before,
      .tp-form .controls::after {
        content: "";
        display: table;
      }

      /* --- Inputs --- */

      select,
      textarea,
      input[type="text"],
      input[type="password"],
      input[type="datetime"],
      input[type="datetime-local"],
      input[type="date"],
      input[type="month"],
      input[type="time"],
      input[type="week"],
      input[type="number"],
      input[type="email"],
      input[type="url"],
      input[type="search"],
      input[type="tel"],
      input[type="color"] {
        display: inline-block;
        width: 100%;
        height: 40px !important;
        padding: 0 var(--spacing__3) !important;
        border: var(--borderwidth__1) solid var(--ol__monochrome__200) !important;
        border-radius: var(--radius__md);
        outline: none;
        color: var(--ol__monochrome__950);
        font-family: var(--font__family__inter);
        font-size: var(--font__size__sm);
        font-weight: var(--font__weight__normal);
        line-height: 1.35;
        background: var(--white);
        box-shadow: none !important;
        transition: border-color 125ms ease-in-out;
      }

      input:focus,
      textarea:focus {
        border-color: var(--ol__red__700) !important;
        outline: 0;
        box-shadow: none !important;
      }

      input:disabled,
      input[readonly] {
        background: var(--ol__monochrome__50) !important;
        color: var(--ol__monochrome__400);
        cursor: not-allowed;
      }

      ::-webkit-input-placeholder {
        color: var(--ol__monochrome__400);
      }
      ::-moz-placeholder {
        color: var(--ol__monochrome__400);
      }
      :-ms-input-placeholder {
        color: var(--ol__monochrome__400);
      }

      /* --- Error messages --- */

      .error-message {
        display: none;
        margin-top: var(--spacing__1);
        color: var(--ol__red__700);
        font-family: var(--font__family__inter);
        font-size: 11px;
        font-weight: var(--font__weight__medium);
        line-height: 1.5;
        text-align: left;
      }

      .error-list {
        margin-bottom: var(--spacing__3);
      }

      .validation-error {
        color: var(--ol__red__700);
        font-size: 11px;
        line-height: 2em;
        text-align: left;
      }

      .custom-field-has-errors .input,
      .custom-field-has-errors input {
        border-color: var(--ol__red__700) !important;
      }

      /* --- Help / Links --- */

      .help {
        text-align: left;
      }
      .help > div {
        display: inline-block;
      }

      span.title {
        color: var(--ol__monochrome__500);
        padding: var(--spacing__2) 0 0 0;
        display: block;
        font-size: var(--font__size__xs);
      }

      a,
      a:visited {
        color: var(--ol__red__700);
        cursor: pointer;
        text-decoration: none;
        transition: color 125ms ease-in-out;
      }

      a:hover {
        color: var(--ol__red__800);
        text-decoration: underline;
      }

      /* --- Buttons --- */

      .btn {
        text-decoration: none;
        cursor: pointer;
        padding: 0 var(--spacing__5);
        height: 40px;
        line-height: 40px;
        border-radius: var(--radius__md);
        text-align: center;
        vertical-align: middle;
        display: inline-block;
        border: none;
        font-family: var(--font__family__inter);
        font-size: var(--font__size__sm);
        font-weight: var(--font__weight__bold);
        white-space: nowrap;
        outline: 0;
        transition: background-color 125ms ease-in-out;
      }

      .btn * {
        font-family: var(--font__family__inter) !important;
        text-transform: none;
      }

      .btn-green,
      .btn.btn-green {
        color: var(--white) !important;
        background: var(--ol__red__700) !important;
        border: none !important;
        box-shadow: none !important;
        text-shadow: none !important;
      }

      .btn-green:hover,
      .btn-green:focus {
        background: var(--ol__red__800) !important;
        color: var(--white) !important;
      }

      .btn-link,
      .btn-link:active {
        background: transparent !important;
        box-shadow: none !important;
        border: none !important;
        color: var(--ol__red__700) !important;
        padding: 0;
        height: auto;
        line-height: 1.5;
        font-size: var(--font__size__xs);
        font-weight: var(--font__weight__semibold);
      }

      .btn-link:hover,
      .btn-link:focus {
        color: var(--ol__red__800) !important;
        text-decoration: underline;
        background: transparent !important;
      }

      .btn[disabled],
      .btn.disabled {
        cursor: default;
        opacity: 0.5;
        pointer-events: none;
      }

      .actions {
        margin-top: var(--spacing__5);
      }

      /* --- Social accounts --- */

      .social-accounts-title {
        font-family: var(--font__family__inter);
        font-size: var(--font__size__sm) !important;
        font-weight: var(--font__weight__bold);
        color: var(--ol__monochrome__950);
      }

      .social-group {
        display: flex;
        align-items: center;
        min-height: auto;
        padding: var(--spacing__3) 0;

      .social-group:last-child {
        padding-bottom: 0;

      .social-caption {

      .social-icon {

        background-position: center;
        vertical-align: middle;
        width: 20px;
        height: 20px;
        margin-right: var(--spacing__2);
        margin-top: 0;
      }

      .social-linked {

        align-items: center;
        height: auto;
        line-height: 1.35;
        padding-right: var(--spacing__3);
        font-family: var(--font__family__inter);
        font-size: var(--font__size__xs);
        font-weight: var(--font__weight__normal);

      .social-linked::before {
        content: "";

        background-size: contain;
        background-repeat: no-repeat;
        vertical-align: middle;
      }

      .social-buttons {
        display: inline-flex;
        align-items: center;

      }

      .btn.social {
        min-width: auto;
        height: 28px !important;
        line-height: 28px !important;
        padding: 0 var(--spacing__3) !important;
        border-radius: var(--radius__sm) !important;
        font-size: 11px !important;
        font-weight: var(--font__weight__semibold) !important;
      }

      .btn.social.link {
        color: var(--white) !important;
        background: var(--ol__red__700) !important;

    <script>
      var origin = getParameterByName("origin");
      var sender = getParameterByName("sender");
      var width = getParameterByName("width");
      var insideCheckout = !!getParameterByName("checkout");
      var preloaderHeight = getParameterByName("preloader_height");
      var display = getParameterByName("display_mode");
      var roundedPreloader = getParameterByName("rounded_preloader");

      function sendMessage(event, params) {
        var message = {
          sender: sender,
          event: event,
          params: params,
        };

        try {
          var target = window === window.parent ? window.opener : window.parent;
          target.postMessage(JSON.stringify(message), origin);
        } catch (e) {
          // console.log('failed to send postmessage', e, event, data);
        }
      }

      function addClass(element, className) {
        var prefix = element.className.length > 0 ? " " : "";
        element.className = element.className + prefix + className;
      }

      function getParameterByName(name) {
        var search = window.location.search;
        var regex = new RegExp("[?&]" + name + "(=([^&#]*)|&|#|$)");
        var results = regex.exec(search);
        if (!results) return null;
        if (!results[2]) return "";
        return decodeURIComponent(results[2].replace(/\+/g, " "));
      }

      function getModuleName() {
        var url = window.location.href;
        var pathMatch = url.match(/\/id\/([^/?#]+)/);
        if (!pathMatch || pathMatch.length < 1) {
          return "auth";
        }
        return pathMatch[1];
      }

      function switchPreloader() {
        const container = document.getElementById("preloader-container");
        const module = getModuleName();

        if (!container) return;

        const activeElement = container.querySelector(`[data-switch-case="${module}"]`);
        if (activeElement) {
          addClass(activeElement, "active");
        } else {
          const authElement = container.querySelector("[data-switch-case='auth']");
          if (authElement) {
            addClass(authElement, "active");
          }
        }
      }

      var appRoute = window.location.hash.substr(1).slice(1).split("?")[0];
      addClass(document.body, appRoute);
      switchPreloader();

      if (preloaderHeight) {
        addClass(document.body, "piano-id-short");
        var preloaderItem = document.querySelector(".p-input--cf");
        preloaderItem.style.height = preloaderHeight + "px";

        if (roundedPreloader) {
          addClass(document.body, "piano-id-rounded");
        }
      }

      if (display) {
        addClass(document.body, "piano-id-" + display);
      }

      if (appRoute !== "profile") {
        if (insideCheckout && !preloaderHeight) {
          addClass(document.body, "inside-checkout");
        }

        sendMessage("resize", {
          height: window.document.body.clientHeight,
          width: width ? +width : undefined,
        });
      }
    </script>
